Generátor Frekvencí & Meditace připravenou k použití zcela bez internetu.

JAK APLIKACI SPUSTIT:
---------------------
1. Systém Windows (Máte 3 jednoduché možnosti):
   A) Dvakrát klikněte na soubor "generator_frekvenci_offline.html"
      (Aplikace je 100% samostatná a otevře se přímo ve vašem prohlížeči).
   B) Dvakrát klikněte na soubor "Spustit_Aplikaci_Windows.bat"
      (Automaticky najde a otevře soubor ve výchozím prohlížeči).
   C) Dvakrát klikněte na soubor "Spustit_Pres_Lokalni_Server_Windows.bat"
      (Spustí vestavěný lehký lokální HTTP server na http://localhost:8080).

2. Systém macOS:
   - Dvakrát klikněte na soubor "generator_frekvenci_offline.html"
   - Nebo spusťte skript "Spustit_Aplikaci_Mac.command".

3. Systém Linux:
   - Dvakrát klikněte na soubor "generator_frekvenci_offline.html"
   - Nebo v terminálu spusťte "./Spustit_Aplikaci_Linux.sh".

HLAVNÍ FUNKCE OFFLINE VERZE:
----------------------------
✔ 100% nezávislost na internetu a vzdálených serverech.
✔ Frekvenční generátor od 1 Hz do 20 000 Hz s jemným laděním a přímým zadáváním.
✔ Kompletní sada Schumannových rezonancí (všech 7 harmonických: 7.83 Hz až 45 Hz).
✔ Kompletní posvátná Solfeggio stupnice & 432 Hz posvátné ladění.
✔ 5 mozkových EEG hladin (Delta, Theta, Alfa, Beta, Gama).
✔ 30minutový strukturovaný meditační program s automatickými fázemi.
✔ Binaurální stereo tóny i izochronní pulzace (pro sluchátka i reproduktory).
✔ Přenos zvuku přes Bluetooth do bezdrátových reproduktorů a sluchátek.
✔ Spektrální osciloskop a FFT frekvenční analyzátor v reálném čase.
✔ Všechny zvukové vlny syntetizuje přímo procesor vaší zvukové karty (Web Audio API).

UŽIVATELSKÉ PŘEDVOLBY:
----------------------
Vaše vytvořené a upravené předvolby jsou automaticky bezpečně ukládány
do lokální paměti prohlížeče (LocalStorage) na tomto počítači.
